name: Update HK Map Data

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:

concurrency:
  group: update-hk-map-data
  cancel-in-progress: true   # cancel any queued run; only the latest matters

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch HK map data
        run: python scripts/fetch_hk_map_data.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hk_bus_routes.json data/hk_traffic_speeds.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update HK map data $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            # Retry loop: handles a concurrent push from another workflow run
            # or a sibling scheduled workflow (airport/stocks) reaching main first.
            for attempt in 1 2 3; do
              git pull --rebase origin main
              git push origin main && { echo "Pushed on attempt $attempt"; break; }
              if [ "$attempt" -lt 3 ]; then
                echo "Push rejected (attempt $attempt/3); re-syncing in $((attempt * 10))s..."
                sleep $((attempt * 10))
              else
                echo "Push failed after 3 attempts"
                exit 1
              fi
            done
          fi
